name: Update Recent Activity

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-recent-activity
  cancel-in-progress: false

jobs:
  update-recent-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true

      - name: Update recent-activity section
        env:
          GITHUB_USERNAME: nainpatel028
          README_PATH: README.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_recent_activity.py

      - name: Commit and push if README changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes to README.md — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update recent GitHub activity"
          git push
